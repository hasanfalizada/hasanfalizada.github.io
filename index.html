<!-- Application Initialization -->
<script>
    // +++===+++ 2025-08-27 09:00 UTC — Hasan Alizada — Updated initialization with local jsPDF
    let appInitialized = false; // Prevent double initialization

    document.addEventListener('DOMContentLoaded', function () {

        // Wait for all scripts to load, then initialize
        const checkAndInitialize = () => {
            if (appInitialized) {
                return; // Already initialized
            }

            if (typeof App !== 'undefined' && typeof window.App !== 'undefined') {
                appInitialized = true;
                window.App.initialize();
            } else {
                // Retry after a short delay
                setTimeout(checkAndInitialize, 100);
            }
        };

        checkAndInitialize();
    });
</script>
